version: v1.0
name: Test Etplugin
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
blocks:
  - name: Smoke
    task:
      jobs:
        - name: Load & build
          commands:
            - checkout
            - sem-version ruby $RUBY_VERSION
            - gem install bundler -v ">= 2.0"
            - bundle install
            - bundle exec ruby -Ilib -e "require 'rails'; require 'jquery-etmodel/rails'"
            - gem build jquery-etmodel-rails.gemspec
          matrix:
            - env_var: RUBY_VERSION
              values:
                - '3.3'
                - '4.0'
